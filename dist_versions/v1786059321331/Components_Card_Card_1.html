<template id="card-template">
  <div class="card position-relative" role="region">
    <div class="card-header d-flex align-items-start justify-content-between gap-2">
      <div class="d-flex align-items-start gap-2">
        <div class="card-icon d-none" aria-hidden="true"></div>
        <div>
          <h5 class="card-title mb-0" id="card-title"></h5>
          <small class="card-subtitle text-muted"></small>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="card-badge"></div>
        <div class="card-header-actions d-flex gap-1"></div>
      </div>
    </div>

    <div class="card-collapse collapse show">
      <div class="card-body">
        <!-- body content inserted here -->
      </div>
    </div>

    <div class="card-footer bg-transparent border-0"></div>

    <!-- Loading overlay -->
    <div class="card-loading-overlay d-none position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center">
      <div class="spinner-border" role="status" aria-hidden="true"></div>
      <span class="visually-hidden">Loading</span>
    </div>

    <!-- Empty state -->
    <div class="card-empty-state d-none w-100 h-100 d-flex align-items-center justify-content-center p-3" role="status" aria-live="polite">
      <div class="text-center text-muted small">No content</div>
    </div>
  </div>
</template>
