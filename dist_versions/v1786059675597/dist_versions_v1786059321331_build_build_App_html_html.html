<style>
  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 24px; font-weight: 500; color: var(--text-primary); }
  .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
  .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; box-shadow: var(--shadow-sm); }
  .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .card-icon { font-size: 20px; color: var(--primary-color); }
  .card-value { font-size: 26px; font-weight: 700; color: var(--text-primary); }
  .dashboard-panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; box-shadow: var(--shadow-sm); }
  .panel-title { font-size: 16px; font-weight: 500; color: var(--text-primary); margin-bottom: 14px; }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .dashboard-action { border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary); border-radius: 4px; padding: 8px 14px; cursor: pointer; }
  .dashboard-action:hover { border-color: var(--primary-color); color: var(--primary-color); }
  .dashboard-status { color: var(--text-secondary); font-size: 14px; }
  .dashboard-loader, .dashboard-error { padding: 16px; border-radius: 6px; margin-bottom: 20px; }
  .dashboard-loader { background: #F1F5F9; color: var(--text-secondary); }
  .dashboard-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
  .hidden { display: none; }
</style>

<div id="dashboard-view">
  <div class="page-header">
    <h2 class="page-title">Executive Dashboard</h2>
    <p class="page-subtitle">Labour Cooperative Society Operations &amp; Financial Snapshot</p>
  </div>

  <div id="dashboard-loader" class="dashboard-loader">Loading dashboard data...</div>
  <div id="dashboard-error" class="dashboard-error hidden" role="alert"></div>
  <div id="dashboard-cards" class="grid-container"></div>

  <div class="grid-container">
    <section class="dashboard-panel">
      <h3 class="panel-title">Quick Actions</h3>
      <div class="quick-actions">
        <button class="dashboard-action" type="button" onclick="loadModule('Settings')">System Settings</button>
        <button class="dashboard-action" type="button" onclick="DashboardModule.load()">Refresh Dashboard</button>
      </div>
    </section>
    <section class="dashboard-panel">
      <h3 class="panel-title">System Status</h3>
      <div id="dashboard-system-status" class="dashboard-status">Checking system status...</div>
    </section>
  </div>

  <section class="dashboard-panel">
    <h3 class="panel-title">Recent Activity</h3>
    <div id="dashboard-recent-activity" class="dashboard-status">No recent activity.</div>
  </section>
</div>

<script>
  window.DashboardModule = (function () {
    const icons = {
      Societies: 'groups', Suppliers: 'local_shipping', 'Execution Agencies': 'engineering',
      Tenders: 'gavel', 'Work Orders': 'assignment', 'Government Bills': 'receipt_long',
      'GST Purchases': 'shopping_bag', 'Voucher Register': 'book'
    };

    function setLoading(isLoading) {
      document.getElementById('dashboard-loader').classList.toggle('hidden', !isLoading);
    }

    function showError(message) {
      const errorBox = document.getElementById('dashboard-error');
      errorBox.textContent = message || 'Dashboard data could not be loaded.';
      errorBox.classList.remove('hidden');
    }

    function renderCards(cards) {
      const container = document.getElementById('dashboard-cards');
      container.innerHTML = '';
      (cards || []).forEach(card => {
        const element = document.createElement('div');
        element.className = 'card';
        element.innerHTML = '<div class="card-header-flex"><span class="card-title"></span><span class="material-symbols-outlined card-icon"></span></div><div class="card-value"></div>';
        element.querySelector('.card-title').textContent = card.title || '';
        element.querySelector('.card-icon').textContent = icons[card.title] || 'dashboard';
        element.querySelector('.card-value').textContent = Number(card.value) || 0;
        container.appendChild(element);
      });
    }

    function renderSystem(system) {
      const status = document.getElementById('dashboard-system-status');
      status.textContent = system && system.databaseConnected
        ? `Connected to ${system.spreadsheetName || 'the ERP database'}`
        : 'Database connection unavailable. Showing safe defaults.';
    }

    function render(data) {
      renderCards(data && data.cards);
      renderSystem(data && data.system);
      const activity = document.getElementById('dashboard-recent-activity');
      activity.textContent = data && data.recentActivity && data.recentActivity.length
        ? `${data.recentActivity.length} recent activities` : 'No recent activity.';
    }

    function load() {
      const loader = document.getElementById('dashboard-loader');
      if (!loader) return;
      document.getElementById('dashboard-error').classList.add('hidden');
      setLoading(true);
      google.script.run
        .withSuccessHandler(response => {
          setLoading(false);
          if (!response || !response.success) {
            showError(response && response.message);
            return;
          }
          render(response.data || {});
        })
        .withFailureHandler(error => {
          setLoading(false);
          showError(error && error.message);
        })
        .initializeDashboard();
    }

    return { load };
  })();

  document.addEventListener('DOMContentLoaded', () => DashboardModule.load());
</script>
