<script>
window.ContractorMasterModule = (function(){
  'use strict';
  var M = {};
  var toolbar, searchBox, dataTable, modal, alertComp, spinner;
  var allRows = [];
  var COL = { id: 'Contractor ID', name: 'Contractor Name', firm: 'Firm Name', reg: 'Registration Number', gstin: 'GSTIN', pan: 'PAN', mobile: 'Mobile', district: 'District', taluka: 'Taluka', active: 'Active' };

  function toast(msg,type){ if (window.SahakarComponents && window.SahakarComponents.Alert && alertComp){ alertComp.update({ title: '', body: msg, type: type||'info' }); alertComp.show(); setTimeout(()=>alertComp.hide(),3000); } else console.log('Toast',msg); }
  function setLoading(on){ if (spinner) on?spinner.show():spinner.hide(); }
  function handleError(err){ console.error('ContractorMasterModule',err); toast(err && err.message?err.message:'Unexpected error','danger'); }

  function buildColumns(){ return [ { key: COL.name, title: 'Contractor Name' }, { key: COL.firm, title: 'Firm' }, { key: COL.reg, title: 'Registration No.' }, { key: COL.gstin, title: 'GSTIN' }, { key: COL.pan, title: 'PAN' }, { key: COL.district, title: 'District' }, { key: COL.mobile, title: 'Mobile' }, { key: COL.active, title: 'Active', format: v => (String(v).toLowerCase()==='true'||v===true)?'Yes':'No' } ]; }
  function prepareRows(rows){ return (rows||[]).map(r=>r); }

  function loadData(q){ setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ handleError(resp); return; } allRows = resp.data||[]; if (dataTable) dataTable.update({ rows: prepareRows(allRows) }); renderSummaryCards(); }).withFailureHandler(function(e){ setLoading(false); handleError(e); }).getContractors({ q: q||'' }); }

  function renderSummaryCards(){ var total=allRows.length; var active=allRows.filter(r=> String(r[COL.active]).toLowerCase()==='true' || r[COL.active]===true).length; var inactive=total-active; var container=document.getElementById('contractorSummaryRow'); if(!container) return; container.innerHTML=''; var items=[{title:'Total Contractors',value:total},{title:'Active',value:active},{title:'Inactive',value:inactive},{title:'Blacklisted',value: allRows.filter(r=> r['Blacklisted']===true).length}]; items.forEach(function(it){ if (window.SahakarComponents && window.SahakarComponents.Card){ window.SahakarComponents.Card.create(container,{ title: it.title, subtitle: String(it.value), className: 'col' }); } else { var d=document.createElement('div'); d.className='card p-3 col'; d.innerHTML='<h6>'+it.title+'</h6><div><strong>'+it.value+'</strong></div>'; container.appendChild(d); } }); }

  function initComponents(){ if (window.SahakarComponents && window.SahakarComponents.Toolbar){ toolbar = window.SahakarComponents.Toolbar.create('#contractorToolbarContainer',{ title:'Contractor Master', subtitle:'Manage contractors', primaryButton:{ text:'Add Contractor', onClick: openCreate }, refreshButton:{ text:'Refresh', onClick: ()=> loadData('') } }); }
    if (window.SahakarComponents && window.SahakarComponents.SearchBox){ searchBox = window.SahakarComponents.SearchBox.create('#contractorSearchContainer',{ placeholder:'Search contractors by name, reg no, GSTIN, PAN', debounce:300, callbacks:{ onSearch: function(q){ loadData(q); } } }); }
    var filtersHost = document.getElementById('contractorFiltersContainer'); if (filtersHost){ filtersHost.innerHTML = '<select id="filterActive" class="form-select form-select-sm"><option value="">All</option><option value="true">Active</option><option value="false">Inactive</option></select>'; filtersHost.querySelectorAll('select').forEach(s=>s.addEventListener('change', applyFilters)); }
    if (window.SahakarComponents && window.SahakarComponents.DataTable){ dataTable = window.SahakarComponents.DataTable.create('#contractorTableContainer',{ columns: buildColumns(), rows: [], pageSize:10, actions:[{key:'view',label:'View'},{key:'edit',label:'Edit'},{key:'blacklist',label:'Blacklist'},{key:'delete',label:'Delete'}], onAction: handleAction }); }
    if (window.SahakarComponents && window.SahakarComponents.Modal){ modal = window.SahakarComponents.Modal.create('#contractorModalHost',{ title:'', body:'', primaryButton:{ text:'Save', onClick: handleModalSave }, secondaryButton:{ text:'Cancel', onClick: function(){ modal.hide(); } } }); }
    if (window.SahakarComponents && window.SahakarComponents.Alert){ alertComp = window.SahakarComponents.Alert.create('#contractorAlertHost',{ type:'info', title:'', body:'', timeout:3000 }); }
    if (window.SahakarComponents && window.SahakarComponents.Spinner){ spinner = window.SahakarComponents.Spinner.create('#contractorSpinnerHost',{ size:'large', type:'border', fullscreen:false }); }
  }

  function applyFilters(){ var status=document.getElementById('filterActive').value; var rows = allRows.filter(function(r){ if (status){ var act = String(r[COL.active]).toLowerCase()==='true' || r[COL.active]===true; if (status==='true' && !act) return false; if (status==='false' && act) return false; } return true; }); if (dataTable) dataTable.update({ rows: prepareRows(rows) }); }

  function handleAction(key,row){ if (key==='view') openView(row); else if (key==='edit') openEdit(row); else if (key==='blacklist') toggleBlacklist(row); else if (key==='delete') confirmDelete(row); }

  function openCreate(){ if (!modal) return; modal.setTitle('Create Contractor'); modal.setBody(buildFormHtml()); modal.show(); }
  function openEdit(row){ if (!modal) return; modal.setTitle('Edit Contractor'); modal.setBody(buildFormHtml(row)); modal.show(); }
  function openView(row){ if (!modal) return; modal.setTitle('View Contractor'); modal.setBody(buildFormHtml(row,true)); modal.show(); }

  function buildFormHtml(rec, readOnly){ rec = rec||{}; var c=document.createElement('div'); c.className='p-2'; var grid=document.createElement('div'); grid.className='row g-2'; var fields=[['Contractor Name','col-12'],['Firm Name','col-12'],['Registration Number','col-6'],['GSTIN','col-6'],['PAN','col-6'],['Aadhaar','col-6'],['Mobile','col-6'],['Alternate Mobile','col-6'],['Email','col-6'],['Website','col-6'],['Address','col-12']]; fields.forEach(function(f){ var col=document.createElement('div'); col.className=f[1]; var fg=document.createElement('div'); fg.className='mb-2'; var label=document.createElement('label'); label.className='form-label'; label.textContent=f[0]; var input=document.createElement('input'); input.className='form-control form-control-sm'; input.name=f[0]; input.value = rec[f[0]]||''; if (readOnly) input.disabled=true; fg.appendChild(label); fg.appendChild(input); col.appendChild(fg); grid.appendChild(col); }); c.appendChild(grid); return c; }
  function collectFormData(root){ var o={}; var inputs = root.querySelectorAll('input,textarea,select'); inputs.forEach(function(i){ o[i.name] = i.type==='checkbox'?i.checked:i.value; }); return o; }

  function handleModalSave(e, inst){ try{ var root = inst && inst.el ? inst.el : document.querySelector('#contractorModalHost'); var body = root.querySelector('.modal-body') || root; var data = collectFormData(body); setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ toast((resp&&resp.message)||'Validation failed','danger'); return; } modal.hide(); toast('Saved','success'); loadData(''); }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).saveContractor(data); } catch(ex){ handleError(ex); } }

  function confirmDelete(row){ if (!confirm('Soft delete this contractor?')) return; setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ toast((resp&&resp.message)||'Delete failed','danger'); return; } toast('Deleted','success'); loadData(''); }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).softDeleteContractor(row[COL.id]); }

  function toggleBlacklist(row){ var id = row[COL.id]; if (!id) return; var black = row['Blacklisted']===true || String(row['Blacklisted']).toLowerCase()==='true'; var payload = { 'Contractor ID': id, 'Blacklisted': !black, 'Blacklisted By': !black? 'system': '', 'Blacklisted Date': !black? new Date().toISOString(): '' }; setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ toast('Operation failed','danger'); return; } toast('Updated','success'); loadData(''); }).withFailureHandler(function(e){ setLoading(false); handleError(e); }).updateContractor(id, payload); }

  M.initialize = function(){ try{ initComponents(); loadData(''); } catch(e){ handleError(e); } };
  return M; })();

document.addEventListener('DOMContentLoaded', function(){ if (window.ContractorMasterModule) ContractorMasterModule.initialize(); });
</script>
