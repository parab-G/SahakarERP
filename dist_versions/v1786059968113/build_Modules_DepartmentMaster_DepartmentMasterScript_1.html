<script>
window.DepartmentMasterModule = (function(){
  'use strict';
  var M = {};
  var toolbar, searchBox, dataTable, modal, alertComp, spinner;
  var allRows = [];
  var COL = { id: 'Department ID', code: 'Department Code', name: 'Department Name', type: 'Department Type', active: 'Active' };

  function toast(msg,type){ if (window.SahakarComponents && window.SahakarComponents.Alert && alertComp){ alertComp.update({ title: '', body: msg, type: type||'info' }); alertComp.show(); setTimeout(()=>alertComp.hide(),3000); } else console.log('Toast',msg); }
  function setLoading(on){ if (spinner) on?spinner.show():spinner.hide(); }
  function handleError(err){ console.error('DepartmentMasterModule',err); toast(err && err.message?err.message:'Unexpected error','danger'); }

  function buildColumns(){ return [ { key: COL.name, title: 'Department Name' }, { key: COL.code, title: 'Code' }, { key: COL.type, title: 'Type' }, { key: 'Contact Officer', title: 'Contact' }, { key: 'Office Phone', title: 'Phone' }, { key: 'District', title: 'District' }, { key: COL.active, title: 'Active', format: v => (String(v).toLowerCase()==='true'||v===true)?'Yes':'No' } ]; }
  function prepareRows(rows){ return (rows||[]).map(r=>r); }

  function loadData(q){ setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ handleError(resp); return; } allRows = resp.data||[]; if (dataTable) dataTable.update({ rows: prepareRows(allRows) }); renderSummaryCards(); }).withFailureHandler(function(e){ setLoading(false); handleError(e); }).getDepartments({ q: q||'' }); }

  function renderSummaryCards(){ var total=allRows.length; var active=allRows.filter(r=> String(r['Active']).toLowerCase()==='true' || r['Active']===true).length; var inactive=total-active; var container=document.getElementById('departmentSummaryRow'); if(!container) return; container.innerHTML=''; var items=[{title:'Total Departments',value:total},{title:'Active',value:active},{title:'Inactive',value:inactive},{title:'With GST',value: allRows.filter(r=> r['GST Applicable']===true).length}]; items.forEach(function(it){ if (window.SahakarComponents && window.SahakarComponents.Card){ window.SahakarComponents.Card.create(container,{ title: it.title, subtitle: String(it.value), className: 'col' }); } else { var d=document.createElement('div'); d.className='card p-3 col'; d.innerHTML='<h6>'+it.title+'</h6><div><strong>'+it.value+'</strong></div>'; container.appendChild(d); } }); }

  function initComponents(){ if (window.SahakarComponents && window.SahakarComponents.Toolbar){ toolbar = window.SahakarComponents.Toolbar.create('#departmentToolbarContainer',{ title:'Department Master', subtitle:'Manage departments', primaryButton:{ text:'Add Department', onClick: openCreate }, refreshButton:{ text:'Refresh', onClick: ()=> loadData('') } }); }
    if (window.SahakarComponents && window.SahakarComponents.SearchBox){ searchBox = window.SahakarComponents.SearchBox.create('#departmentSearchContainer',{ placeholder:'Search by name, code, officer', debounce:300, callbacks:{ onSearch: function(q){ loadData(q); } } }); }
    var filtersHost = document.getElementById('departmentFiltersContainer'); if (filtersHost){ filtersHost.innerHTML = '<select id="filterActive" class="form-select form-select-sm"><option value="">All</option><option value="true">Active</option><option value="false">Inactive</option></select>'; filtersHost.querySelectorAll('select').forEach(s=>s.addEventListener('change', applyFilters)); }
    if (window.SahakarComponents && window.SahakarComponents.DataTable){ dataTable = window.SahakarComponents.DataTable.create('#departmentTableContainer',{ columns: buildColumns(), rows: [], pageSize:10, actions:[{key:'view',label:'View'},{key:'edit',label:'Edit'},{key:'delete',label:'Delete'}], onAction: handleAction }); }
    if (window.SahakarComponents && window.SahakarComponents.Modal){ modal = window.SahakarComponents.Modal.create('#departmentModalHost',{ title:'', body:'', primaryButton:{ text:'Save', onClick: handleModalSave }, secondaryButton:{ text:'Cancel', onClick: function(){ modal.hide(); } } }); }
    if (window.SahakarComponents && window.SahakarComponents.Alert){ alertComp = window.SahakarComponents.Alert.create('#departmentAlertHost',{ type:'info', title:'', body:'', timeout:3000 }); }
    if (window.SahakarComponents && window.SahakarComponents.Spinner){ spinner = window.SahakarComponents.Spinner.create('#departmentSpinnerHost',{ size:'large', type:'border', fullscreen:false }); }
  }

  function applyFilters(){ var status=document.getElementById('filterActive').value; var rows = allRows.filter(function(r){ if (status){ var act = String(r['Active']).toLowerCase()==='true' || r['Active']===true; if (status==='true' && !act) return false; if (status==='false' && act) return false; } return true; }); if (dataTable) dataTable.update({ rows: prepareRows(rows) }); }

  function handleAction(key,row){ if (key==='view') openView(row); else if (key==='edit') openEdit(row); else if (key==='delete') confirmDelete(row); }

  function openCreate(){ if (!modal) return; modal.setTitle('Create Department'); modal.setBody(buildFormHtml()); modal.show(); }
  function openEdit(row){ if (!modal) return; modal.setTitle('Edit Department'); modal.setBody(buildFormHtml(row)); modal.show(); }
  function openView(row){ if (!modal) return; modal.setTitle('View Department'); modal.setBody(buildFormHtml(row,true)); modal.show(); }

  function buildFormHtml(rec, readOnly){ rec = rec||{}; var c=document.createElement('div'); c.className='p-2'; var grid=document.createElement('div'); grid.className='row g-2'; var fields=[['Department Code','col-4'],['Department Name','col-8'],['Department Type','col-4'],['Parent Department','col-4'],['Short Name','col-4'],['Office Address','col-12'],['Village','col-4'],['Taluka','col-4'],['District','col-4'],['State','col-4'],['Pincode','col-2'],['Office Phone','col-4'],['Email','col-4'],['Website','col-4'],['Contact Officer','col-6'],['Designation','col-6']]; fields.forEach(function(f){ var col=document.createElement('div'); col.className=f[1]; var fg=document.createElement('div'); fg.className='mb-2'; var label=document.createElement('label'); label.className='form-label'; label.textContent=f[0]; var input=document.createElement('input'); input.className='form-control form-control-sm'; input.name=f[0]; input.value = rec[f[0]]||''; if (readOnly) input.disabled=true; fg.appendChild(label); fg.appendChild(input); col.appendChild(fg); grid.appendChild(col); }); c.appendChild(grid); return c; }
  function collectFormData(root){ var o={}; var inputs = root.querySelectorAll('input,textarea,select'); inputs.forEach(function(i){ o[i.name] = i.type==='checkbox'?i.checked:i.value; }); return o; }

  function handleModalSave(e, inst){ try{ var root = inst && inst.el ? inst.el : document.querySelector('#departmentModalHost'); var body = root.querySelector('.modal-body') || root; var data = collectFormData(body); setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ toast((resp&&resp.message)||'Validation failed','danger'); return; } modal.hide(); toast('Saved','success'); loadData(''); }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).saveDepartment(data); } catch(ex){ handleError(ex); } }

  function confirmDelete(row){ if (!confirm('Soft delete this department?')) return; setLoading(true); google.script.run.withSuccessHandler(function(resp){ setLoading(false); if (!resp||!resp.success){ toast((resp&&resp.message)||'Delete failed','danger'); return; } toast('Deleted','success'); loadData(''); }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).softDeleteDepartment(row[COL.id]); }

  M.initialize = function(){ try{ initComponents(); loadData(''); } catch(e){ handleError(e); } };
  return M; })();

document.addEventListener('DOMContentLoaded', function(){ if (window.DepartmentMasterModule) DepartmentMasterModule.initialize(); });
</script>
