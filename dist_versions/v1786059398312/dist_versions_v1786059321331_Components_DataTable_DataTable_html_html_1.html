<template id="datatable-template">
  <div class="datatable-wrapper w-100">
    <div class="d-flex align-items-center justify-content-between mb-2 datatable-toolbar">
      <div class="d-flex align-items-center gap-2 datatable-left">
        <div class="datatable-search d-none">
          <input type="search" class="form-control form-control-sm" placeholder="Search" aria-label="Search table">
        </div>
      </div>
      <div class="datatable-right d-flex align-items-center gap-2">
        <div class="datatable-status text-muted small"></div>
      </div>
    </div>

    <div class="table-responsive position-relative">
      <div class="datatable-loading-overlay d-none position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center">
        <div class="spinner-border" role="status" aria-hidden="true"></div>
        <span class="visually-hidden">Loading</span>
      </div>

      <table class="table table-sm table-hover mb-0" role="grid" aria-label="Data table">
        <thead class="thead-light position-sticky top-0 bg-white">
          <tr role="row" class="datatable-headers"></tr>
        </thead>
        <tbody class="datatable-body">
        </tbody>
      </table>
    </div>

    <div class="datatable-footer d-flex align-items-center justify-content-between mt-2">
      <div class="datatable-pagination d-flex gap-2 align-items-center"></div>
      <div class="datatable-empty text-muted small d-none"></div>
    </div>
  </div>
</template>
