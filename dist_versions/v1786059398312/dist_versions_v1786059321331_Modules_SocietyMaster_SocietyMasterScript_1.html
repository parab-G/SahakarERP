<script>
window.SocietyMasterModule = (function(){
  'use strict';

  // Public API object
  var M = {};

  // Component instances
  var toolbar, searchBox, dataTable, pagination, modal, alertComp, spinner;

  // Cached rows
  var allRows = [];

  // Sheet header keys used by services
  var COL = {
    id: 'Society ID',
    name: 'Society Name',
    regNo: 'Registration Number',
    regDate: 'Registration Date',
    district: 'District',
    taluka: 'Taluka',
    status: 'Active Status'
  };

  // Helper: show toast via Alert component or fallback
  function toast(message, type){ if (window.SahakarComponents && window.SahakarComponents.Alert && alertComp){ alertComp.show(); alertComp.update({ body: message, type: type || 'info' }); setTimeout(()=>alertComp.hide(), 2500); } else { console.log('Toast:', message); }}

  function setLoading(on){ if (spinner) { if (on) spinner.show(); else spinner.hide(); } }

  function handleError(err){ console.error('SocietyMasterModule error', err); if (err && err.message) toast(err.message,'danger'); else toast('Unexpected error','danger'); }

  // Build DataTable columns using sheet headers as keys
  function buildColumns(){ return [
    { key: COL.name, title: 'Society Name' },
    { key: COL.regNo, title: 'Registration No.' },
    { key: COL.regDate, title: 'Registration Date' , format: (v)=> v ? new Date(v).toLocaleDateString() : '' },
    { key: COL.district, title: 'District' },
    { key: COL.taluka, title: 'Taluka' },
    { key: COL.status, title: 'Status', format: v => (String(v).toLowerCase()==='true' || v===true) ? 'Active' : 'Inactive' }
  ]; }

  // Transform raw rows to DataTable row shape (pass-through keys)
  function prepareRows(rows){ return (rows||[]).map(function(r){ return r; }); }

  // Load data from server (uses existing service wrapper getSocieties for compatibility)
  function loadData(keyword){ setLoading(true);
    google.script.run.withSuccessHandler(function(response){ setLoading(false); if (!response || !response.success){ handleError(response || new Error('No response')); return; } allRows = response.data || []; // update DataTable
      if (dataTable){ dataTable.update({ rows: prepareRows(allRows) }); }
      renderSummaryCards();
    }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).getSocieties(keyword || ''); }

  // Render summary cards
  function renderSummaryCards(){ var total = allRows.length; var active = allRows.filter(r=> String(r[COL.status]).toLowerCase()==='true' || r[COL.status]===true).length; var deleted = 0; var inactive = total - active - deleted; // deleted handling depends on sheet
    var container = document.getElementById('societySummaryRow'); if (!container) return; container.innerHTML='';
    var items = [ { title: 'Total Societies', value: total }, { title: 'Active', value: active }, { title: 'Inactive', value: inactive }, { title: 'Deleted', value: deleted } ];
    items.forEach(function(it){ var card = null; if (window.SahakarComponents && window.SahakarComponents.Card){ card = window.SahakarComponents.Card.create(container, { title: it.title, subtitle: String(it.value), className: 'col' }); } else { var div = document.createElement('div'); div.className='card p-3 col'; div.innerHTML = '<h6>'+it.title+'</h6><div><strong>'+it.value+'</strong></div>'; container.appendChild(div); } }); }

  // Initialize reusable components
  function initComponents(){
    // Toolbar
    if (window.SahakarComponents && window.SahakarComponents.Toolbar){ toolbar = window.SahakarComponents.Toolbar.create('#societyToolbarContainer', {
      title: 'Society Master', subtitle: 'Manage society records', primaryButton: { text: 'Create', onClick: openCreateModal }, refreshButton: { text: 'Refresh', onClick: ()=> loadData('') }, exportButton: { text: 'Export', onClick: ()=> toast('Export not implemented') }, callbacks: {}
    }); }

    // SearchBox
    if (window.SahakarComponents && window.SahakarComponents.SearchBox){ searchBox = window.SahakarComponents.SearchBox.create('#societySearchContainer', { placeholder: 'Search by name, reg no, GST or PAN', debounce: 300, callbacks: { onSearch: function(q){ loadData(q); } } }); }

    // Filters - small native controls using Bootstrap
    var filtersHost = document.getElementById('societyFiltersContainer'); if (filtersHost){ filtersHost.innerHTML = '<select id="filterStatus" class="form-select form-select-sm"><option value="">All Status</option><option value="true">Active</option><option value="false">Inactive</option></select><select id="filterType" class="form-select form-select-sm"><option value="">All Types</option><option value="cooperative">Cooperative</option><option value="society">Society</option><option value="trust">Trust</option><option value="company">Company</option></select><select id="filterDistrict" class="form-select form-select-sm"><option value="">All Districts</option></select>'; filtersHost.querySelectorAll('select').forEach(s=> s.addEventListener('change', applyFilters)); }

    // DataTable
    if (window.SahakarComponents && window.SahakarComponents.DataTable){ dataTable = window.SahakarComponents.DataTable.create('#societyTableContainer', { columns: buildColumns(), rows: [], pageSize: 10, sortable: true, searchable: false, actions: [ { key: 'view', label: 'View' }, { key: 'edit', label: 'Edit' }, { key: 'delete', label: 'Delete' } ], callbacks: {}, onAction: handleTableAction, onRowClick: function(r){ openViewModal(r); } }); }

    // Pagination - fallback basic controls handled by DataTable

    // Modal
    if (window.SahakarComponents && window.SahakarComponents.Modal){ modal = window.SahakarComponents.Modal.create('#societyModalHost', { title: '', body: '', primaryButton: { text: 'Save', onClick: handleModalSave }, secondaryButton: { text: 'Cancel', onClick: function(){ modal.hide(); } } }); }

    // Alert
    if (window.SahakarComponents && window.SahakarComponents.Alert){ alertComp = window.SahakarComponents.Alert.create('#societyAlertHost', { type: 'info', title: '', body: '', timeout: 3000 }); }

    // Spinner
    if (window.SahakarComponents && window.SahakarComponents.Spinner){ spinner = window.SahakarComponents.Spinner.create('#societySpinnerHost', { size: 'large', type: 'border', fullscreen: false }); }
  }

  function applyFilters(){ var status = document.getElementById('filterStatus').value; var type = document.getElementById('filterType').value; var district = document.getElementById('filterDistrict').value; var rows = allRows.filter(function(r){ if (status){ var act = String(r[COL.status]).toLowerCase() === 'true' || r[COL.status]===true; if (String(status) === 'true' && !act) return false; if (String(status) === 'false' && act) return false; } if (type && String((r['Society Type']||'')).toLowerCase() !== String(type).toLowerCase()) return false; if (district && String((r['District']||'')).toLowerCase() !== String(district).toLowerCase()) return false; return true; }); if (dataTable) dataTable.update({ rows: prepareRows(rows) }); }

  // Table actions
  function handleTableAction(key, row){ if (key === 'view') openViewModal(row); else if (key === 'edit') openEditModal(row); else if (key === 'delete') confirmDelete(row); }

  function openCreateModal(){ if (!modal) return; modal.setTitle('Create Society'); modal.setBody(buildFormHtml()); modal.show(); }
  function openEditModal(row){ if (!modal) return; modal.setTitle('Edit Society'); modal.setBody(buildFormHtml(row)); modal.show(); }
  function openViewModal(row){ if (!modal) return; modal.setTitle('View Society'); modal.setBody(buildFormHtml(row,true)); modal.show(); }

  function buildFormHtml(record, readOnly){ record = record || {}; var container = document.createElement('div'); container.className = 'p-2'; var grid = document.createElement('div'); grid.className = 'row g-2'; var fields = [ ['Society Name','col-12'], ['Registration Number','col-6'], ['Registration Date','col-6'], ['District','col-6'], ['Taluka','col-6'], ['Mobile No.','col-6'], ['Email','col-6'] ]; fields.forEach(function(f){ var col = document.createElement('div'); col.className = f[1]; var formGroup = document.createElement('div'); formGroup.className = 'mb-2'; var label = document.createElement('label'); label.className = 'form-label'; label.textContent = f[0]; var input = document.createElement('input'); input.className = 'form-control form-control-sm'; input.name = f[0]; input.value = record[f[0]] || ''; if (readOnly) input.disabled = true; formGroup.appendChild(label); formGroup.appendChild(input); col.appendChild(formGroup); grid.appendChild(col); }); container.appendChild(grid); return container; }

  function collectFormData(modalRoot){ var obj = {}; var inputs = modalRoot.querySelectorAll('input,textarea,select'); inputs.forEach(function(i){ obj[i.name] = i.type === 'checkbox' ? i.checked : i.value; }); return obj; }

  function handleModalSave(e, inst){ try{ var root = inst && inst.el ? inst.el : document.querySelector('#societyModalHost'); var formRoot = root.querySelector('.modal-body') || root; var data = collectFormData(formRoot); setLoading(true); google.script.run.withSuccessHandler(function(response){ setLoading(false); if (!response || !response.success){ toast((response && response.message) || 'Validation failed','danger'); return; } modal.hide(); toast('Saved','success'); loadData(''); }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).saveSociety(data); } catch(ex){ handleError(ex); } }

  function confirmDelete(row){ if (!confirm('Are you sure you want to delete this society?')) return; setLoading(true); google.script.run.withSuccessHandler(function(response){ setLoading(false); if (!response || !response.success){ toast((response && response.message)||'Delete failed','danger'); return; } toast('Deleted','success'); loadData(''); }).withFailureHandler(function(err){ setLoading(false); handleError(err); }).softDeleteSociety(row[COL.id]); }

  // Initialize module
  M.initialize = function(){ try{ initComponents(); loadData(''); } catch(ex){ handleError(ex); } };

  return M;
})();

document.addEventListener('DOMContentLoaded', function(){ if (window.SocietyMasterModule) SocietyMasterModule.initialize(); });
</script>
