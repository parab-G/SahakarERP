<template id="toolbar-template">
  <div class="toolbar d-flex flex-column w-100" role="toolbar" aria-label="Module toolbar">
    <div class="toolbar-top d-flex align-items-center justify-content-between w-100 gap-2">
      <div class="toolbar-left d-flex align-items-center gap-3">
        <div class="toolbar-breadcrumb" aria-hidden="false"></div>
        <div class="toolbar-title-group">
          <h4 class="mb-0 toolbar-title"></h4>
          <small class="text-muted toolbar-subtitle"></small>
        </div>
      </div>

      <div class="toolbar-right d-flex align-items-center gap-2">
        <!-- responsive collapse toggle visible on small screens -->
        <button class="btn btn-sm btn-outline-secondary d-md-none toolbar-toggle" type="button" aria-expanded="false" aria-controls="toolbar-actions" aria-label="Show toolbar actions">
          <span class="visually-hidden">Toggle toolbar actions</span>
          <i class="bi bi-three-dots-vertical" aria-hidden="true"></i>
        </button>

        <div class="toolbar-actions d-none d-md-flex align-items-center gap-2" id="toolbar-actions" role="group" aria-label="Toolbar actions">
          <div class="left-actions d-flex gap-1"></div>
          <div class="custom-actions d-flex gap-1"></div>
          <div class="spacer"></div>
          <div class="right-actions d-flex gap-1"></div>
        </div>
      </div>
    </div>

    <div class="toolbar-controls mt-2 d-flex flex-wrap gap-2 align-items-center">
      <div class="input-group input-search me-2" role="search">
        <input type="search" class="form-control form-control-sm toolbar-search" placeholder="Search" aria-label="Search">
      </div>

      <div class="input-group input-filter me-auto" role="search">
        <input type="text" class="form-control form-control-sm toolbar-filter" placeholder="Filter" aria-label="Filter">
      </div>

      <div class="toolbar-cta d-flex gap-1"></div>
    </div>

    <!-- collapsed actions for small screens -->
    <div class="toolbar-collapsed-actions d-none mt-2 border rounded p-2" id="toolbar-collapsed-actions" aria-hidden="true">
      <div class="left-actions-collapsed mb-2"></div>
      <div class="custom-actions-collapsed mb-2"></div>
      <div class="right-actions-collapsed"></div>
    </div>
  </div>
</template>
