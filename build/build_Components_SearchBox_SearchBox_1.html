<template id="searchbox-template">
  <div class="searchbox d-flex align-items-center">
    <label class="visually-hidden" for="searchbox-input">Search</label>
    <div class="input-group">
      <span class="input-group-text searchbox-icon" aria-hidden="true"><i class="bi bi-search"></i></span>
      <input id="searchbox-input" type="search" class="form-control" placeholder="Search" aria-label="Search" />
      <button type="button" class="btn btn-outline-secondary btn-sm searchbox-clear d-none" aria-label="Clear search"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
  </div>
</template>
