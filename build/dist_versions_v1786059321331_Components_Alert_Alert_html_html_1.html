<template id="alert-template">
  <div class="sahakar-alert-wrapper">
    <div class="alert" role="alert" aria-live="polite" aria-atomic="true">
      <div class="d-flex align-items-start">
        <div class="alert-icon me-2" aria-hidden="true"></div>
        <div class="alert-content flex-grow-1">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <strong class="alert-title"></strong>
            </div>
            <div class="alert-actions ms-2"></div>
          </div>
          <div class="alert-message small mt-1"></div>
        </div>
      </div>

      <div class="alert-progress mt-2 d-none">
        <div class="progress sahakar-progress-small">
          <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
      </div>
    </div>
  </div>
</template>
